global
    maxconn 100
    log stdout format raw local0

defaults
    log global
    mode tcp
    retries 3
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout check 2s

# Write traffic: Patroni REST API returns HTTP 200 only on the writable primary.
listen postgres_primary
    bind *:5000
    mode tcp
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 on-marked-down shutdown-sessions
    server pg-node1 pg-node1:5432 maxconn 100 check port 8008
    server pg-node2 pg-node2:5432 maxconn 100 check port 8008

# Optional: open http://localhost:7000/ during drills to see which backend is UP.
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
