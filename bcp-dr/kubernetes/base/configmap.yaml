apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: cloudresilience
  labels:
    app.kubernetes.io/part-of: cloudresilience
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: cloudresilience
  DB_USER: cloudresilience
  JWT_EXPIRES_IN: 24h
  LOG_LEVEL: info
  CORS_ORIGIN: http://localhost:8090
  USER_SERVICE_URL: http://user-service:3001
  PRODUCT_SERVICE_URL: http://product-service:3002
  INVENTORY_SERVICE_URL: http://inventory-service:3003
  ORDER_SERVICE_URL: http://order-service:3004
  NOTIFICATION_SERVICE_URL: http://notification-service:3005
  BCDR_PROBE_EMAIL: bcdr-probe@example.com