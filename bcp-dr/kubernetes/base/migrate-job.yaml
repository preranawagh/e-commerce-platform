apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: cloudresilience
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: cloudresilience
spec:
  # If the database isn't ready yet, the Job just tries again (up to 6 times).
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: cloudresilience
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's user is "node"; Kubernetes needs its number (1000)
        # to prove it isn't root.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: cloudresilience/migrate:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          # Only the two secrets this task needs, not all of them.
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: BCDR_PROBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: BCDR_PROBE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi