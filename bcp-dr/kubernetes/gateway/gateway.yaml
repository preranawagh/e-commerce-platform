# The front door (Gateway API). Envoy Gateway is the controller that turns
# these objects into running Envoy proxies. One listener on port 80; paths are
# routed to the frontend or directly to the API services.

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: web
  namespace: cloudresilience
  labels:
    app.kubernetes.io/part-of: cloudresilience
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# /api/<service>/... → that service (path unchanged); everything else → frontend.
# The longest matching prefix wins, so "/" only catches what the others don't.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: cloudresilience
  labels:
    app.kubernetes.io/part-of: cloudresilience
spec:
  parentRefs:
    - name: web
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/users }
      backendRefs:
        - { name: user-service, port: 3001 }
    - matches:
        - path: { type: PathPrefix, value: /api/products }
      backendRefs:
        - { name: product-service, port: 3002 }
    - matches:
        - path: { type: PathPrefix, value: /api/inventory }
      backendRefs:
        - { name: inventory-service, port: 3003 }
    - matches:
        - path: { type: PathPrefix, value: /api/orders }
      backendRefs:
        - { name: order-service, port: 3004 }
    - matches:
        - path: { type: PathPrefix, value: /api/notifications }
      backendRefs:
        - { name: notification-service, port: 3005 }
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: frontend, port: 8080 }
