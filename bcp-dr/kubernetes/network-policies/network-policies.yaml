# Zero-trust networking inside the namespace: everything is blocked unless a
# policy below allows it. Allowed paths:
#   Envoy Gateway proxy  -> frontend, all five APIs
#   frontend (nginx /api proxy) -> all five APIs
#   order-service        -> user, product, inventory, notification
#   APIs + db-migrate    -> postgres
#   every pod            -> cluster DNS

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: cloudresilience
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: cloudresilience
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Who may call the frontend: only the Gateway's Envoy proxies.
# The frontend may call the five APIs (its built-in /api proxy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: cloudresilience
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
---
# Who may call an API: the Envoy proxies, the frontend, and order-service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: cloudresilience
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - { protocol: TCP, port: 3001 }
        - { protocol: TCP, port: 3002 }
        - { protocol: TCP, port: 3003 }
        - { protocol: TCP, port: 3004 }
        - { protocol: TCP, port: 3005 }
---
# Every API (and the migration Job) may reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-to-database
  namespace: cloudresilience
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [user-service, product-service, inventory-service, order-service, notification-service, db-migrate]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
---
# order-service is the only API that calls other APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-to-services
  namespace: cloudresilience
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [user-service, product-service, inventory-service, notification-service]
      ports:
        - { protocol: TCP, port: 3001 }
        - { protocol: TCP, port: 3002 }
        - { protocol: TCP, port: 3003 }
        - { protocol: TCP, port: 3005 }
---
# The database accepts connections only from the APIs and the migration Job.
# Used by overlays/local (in-cluster postgres); on GKE the target is Cloud SQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: cloudresilience
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [user-service, product-service, inventory-service, order-service, notification-service, db-migrate]
      ports:
        - { protocol: TCP, port: 5432 }
