apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres.yaml
  - envoy-proxy.yaml
patches:
  # On kind, the Gateway's Envoy proxy uses the NodePort settings above.
  - target:
      kind: Gateway
      name: web
    patch: |-
      - op: add
        path: /spec/infrastructure
        value:
          parametersRef:
            group: gateway.envoyproxy.io
            kind: EnvoyProxy
            name: kind-nodeport
